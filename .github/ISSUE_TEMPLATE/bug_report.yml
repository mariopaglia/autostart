name: Report a bug
description: Something did not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security issues must **not** be reported here: see the [Security Policy](https://github.com/mariopaglia/autostart/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: AutoStart version
      description: Settings → About
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: simulator
    attributes:
      label: Simulator and apps involved
      placeholder: "MSFS 2024, Volanta, SPAD.neXt"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → Open log folder. Attach the most recent `.log` file (review it before sending).
