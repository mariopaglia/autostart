[package]
name = "autostart"
version = "0.1.0"
description = "Launches your flight sim helper apps when the simulator starts and closes them when it exits"
authors = ["Mario Paglia"]
license = "MIT"
repository = "https://github.com/mariopaglia/autostart"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows (cargo#8519).
name = "autostart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-process = "2.3"
tauri-plugin-log = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.12"

[target.'cfg(windows)'.dependencies]
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
