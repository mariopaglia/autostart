schema: spec-driven

context: |
  Product: AutoStart — Windows tray app for virtual pilots. Launches a profile's helper apps/URLs
  when a trigger process (e.g. FlightSimulator2024.exe) starts and closes them when it exits.
  Distributed for free to the maintainer's YouTube community (public repo mariopaglia/autostart).
  Stack: Tauri 2, React 19 + TypeScript + Vite, Tailwind CSS 4 + shadcn/ui, lucide-react, Zustand,
  dnd-kit, Zod, i18next. Rust: sysinfo, windows, serde, tokio, thiserror, ts-rs. pnpm.
  Development happens on macOS (non-Windows stubs); real behavior is validated by Windows CI tests and on the published release.
  Maintainer is a senior TS fullstack dev with no Rust experience: keep the Rust layer small and idiomatic.

rules:
  proposal:
    - Planning docs are written in English
  design:
    - Code identifiers, file names and examples in English
  tasks:
    - Code is always in English, following Clean Code; comments only when necessary (why, unsafe, WinAPI quirks)
    - Every task that changes behavior includes its automated tests; Windows-only behavior gets integration tests in src-tauri/src/platform/windows/tests.rs
    - End with a task adding the user-facing changes under "## [Unreleased]" in CHANGELOG.md
    - No preview-build checkpoints: the maintainer validates on the published release (manual Release workflow)
